  # ──────────────────────────────────────────────────────────────────────────
  # MONITORING
  # ──────────────────────────────────────────────────────────────────────────
  MonitoringAlertsTopic:
    Type: AWS::SNS::Topic
    Condition: HasMonitoringAlerts
    Properties:
      TopicName: !Sub "${AWS::StackName}-monitoring-alerts"
      Subscription:
        - Protocol: email
          Endpoint: !Ref MonitoringAlertEmail

  ApiServerErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasMonitoringAlerts
    Properties:
      AlarmName: !Sub "${AWS::StackName}-api-5xx-errors"
      Namespace: AWS/ApiGateway
      MetricName: 5XXError
      Dimensions:
        - Name: ApiName
          Value: !Ref AWS::StackName
        - Name: Stage
          Value: Prod
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 3
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlertsTopic]
      OKActions: [!Ref MonitoringAlertsTopic]

  ExportQueueDelayAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasMonitoringAlerts
    Properties:
      AlarmName: !Sub "${AWS::StackName}-export-queue-delay"
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt ProductExportJobQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 1200
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlertsTopic]
      OKActions: [!Ref MonitoringAlertsTopic]

  ExportJobFailedAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasMonitoringAlerts
    Properties:
      AlarmName: !Sub "${AWS::StackName}-export-jobs-failed"
      Namespace: Uprevit
      MetricName: ExportJobFailed
      Dimensions:
        - Name: Stack
          Value: !Ref AWS::StackName
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlertsTopic]
      OKActions: [!Ref MonitoringAlertsTopic]

  UsageEventSyncFailingAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasMonitoringAlerts
    Properties:
      AlarmName: !Sub "${AWS::StackName}-usage-event-sync-failing"
      Namespace: Uprevit
      MetricName: UsageEventSyncFailed
      Dimensions:
        - Name: Stack
          Value: !Ref AWS::StackName
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 3
      DatapointsToAlarm: 3
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlertsTopic]
      OKActions: [!Ref MonitoringAlertsTopic]

  UsageEventManualCorrectionAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: HasMonitoringAlerts
    Properties:
      AlarmName: !Sub "${AWS::StackName}-usage-event-manual-correction"
      Namespace: Uprevit
      MetricName: UsageEventManualCorrectionRequired
      Dimensions:
        - Name: Stack
          Value: !Ref AWS::StackName
      Statistic: Sum
      Period: 600
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref MonitoringAlertsTopic]
      OKActions: [!Ref MonitoringAlertsTopic]

Outputs:
  ApiBaseUrl:
    Description: API Gateway base URL for the deployed backend stage
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod"
