AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  uprevit-backend

  Sample SAM Template for uprevit-backend

Parameters:
  MongoDbUri:
    Type: String
    Description: "MongoDB connection string URI"
    NoEcho: true
    Default: ""
  DbName:
    Type: String
    Description: "MongoDB database name"
    Default: "uprevit-test"
  UserPoolId:
    Type: String
    Description: "The Cognito User Pool ID for token validation"
  ClientId:
    Type: String
    Description: "The Cognito App Client ID for token validation"
  UploadsBucket:
    Type: String
    Description: "S3 bucket name for uploaded files"
    Default: "uprevit-storage-dev-and-test"
  ExportsBucket:
    Type: String
    Description: "S3 bucket name for generated export files"
    Default: "exports-storage-dev-and-test"
  StandardSymbolsBucket:
    Type: String
    Description: "S3 bucket name for standard symbol library images"
    Default: "uprevit-standard-symbols"
  DocumentationFilesBucket:
    Type: String
    Description: "S3 bucket name for documentation media (videos, future images/PDFs)"
    Default: "uprevit-documentation-files"
  DocumentationCloudFrontDomain:
    Type: String
    Description: "CloudFront distribution domain for documentation videos (e.g. d123.cloudfront.net)"
    Default: ""
  DocumentationCloudFrontKeyPairId:
    Type: String
    Description: "CloudFront key pair id for signed documentation video URLs"
    Default: ""
  DocumentationCloudFrontPrivateKeyParam:
    Type: String
    Description: "SSM Parameter Store path (SecureString) for the CloudFront signing private key PEM"
    Default: ""
  ExportJobQueueUrl:
    Type: String
    Description: "Optional explicit SQS queue URL override for local/dev"
    Default: ""
  ChargebeeSite:
    Type: String
    Description: "Chargebee site subdomain for usage event ingest"
    Default: ""
  ChargebeeApiKey:
    Type: String
    NoEcho: true
    Description: "Chargebee API key for usage event ingest"
    Default: ""
  ChargebeeWebhookUsername:
    Type: String
    Description: "Basic auth username for Chargebee webhooks"
    Default: ""
  ChargebeeWebhookPassword:
    Type: String
    NoEcho: true
    Description: "Basic auth password for Chargebee webhooks"
    Default: ""
  ChargebeeSeatAddonItemPriceId:
    Type: String
    Description: "Legacy Chargebee seat add-on item price ID(s); comma-separated or use monthly/yearly params"
    Default: ""
  ChargebeeSeatAddonItemPriceIdMonthly:
    Type: String
    Description: "Chargebee item price ID for the monthly seat add-on"
    Default: ""
  ChargebeeSeatAddonItemPriceIdYearly:
    Type: String
    Description: "Chargebee item price ID for the yearly seat add-on"
    Default: ""
  ChargebeeApproverSeatAddonItemPriceIdMonthly:
    Type: String
    Description: "Chargebee item price ID for the monthly Approver seat add-on"
    Default: ""
  ChargebeeApproverSeatAddonItemPriceIdYearly:
    Type: String
    Description: "Chargebee item price ID for the yearly Approver seat add-on"
    Default: ""
  ChargebeeSsoAddonItemPriceId:
    Type: String
    Description: "Legacy Chargebee SSO add-on item price ID(s); comma-separated or use monthly/yearly params"
    Default: ""
  ChargebeeSsoAddonItemPriceIdMonthly:
    Type: String
    Description: "Chargebee item price ID for the monthly SSO add-on"
    Default: ""
  ChargebeeSsoAddonItemPriceIdYearly:
    Type: String
    Description: "Chargebee item price ID for the yearly SSO add-on"
    Default: ""
  SesFromAddress:
    Type: String
    Description: "SES sender for notification emails, e.g. Uprevit <notifications@notify.uprevit.com>; empty disables emails"
    Default: ""
  AppBaseUrl:
    Type: String
    Description: "Web app base URL used for links in notification emails, e.g. https://app.uprevit.com"
    Default: ""
  SupportReviewerEmailsParam:
    Type: String
    Description: "SSM Parameter Store path (SecureString) for comma-separated support reviewer emails, e.g. /uprevit/dev/support/reviewer-emails; empty denies all"
    Default: ""
  PosthogSupportSecretParam:
    Type: String
    Description: "SSM Parameter Store path (SecureString) for the PostHog Support secret API key, e.g. /uprevit/dev/support/identity-secret"
    Default: ""
  PosthogProjectToken:
    Type: String
    Description: "Public PostHog project token for backend error tracking; empty disables it"
    Default: ""
  MonitoringAlertEmail:
    Type: String
    Description: "Email that receives CloudWatch monitoring alarms; when set, the alarms are created"
    Default: ""
  BetterStackHeartbeatUrl:
    Type: String
    NoEcho: true
    Description: "Better Stack heartbeat URL pinged by the scheduled billing usage retry job"
    Default: ""
  SupportAttachmentsAllowedOrigins:
    Type: String
    Description: "Comma-separated frontend origins (no spaces) allowed to upload support screenshots, e.g. https://app.uprevit.com; empty blocks browser uploads"
    Default: ""

# More info about Globals: https://github.com/awslabs/serverless-application-model/blob/master/docs/globals.rst
Globals:
  Function:
    Timeout: 120
    MemorySize: 512
    Runtime: nodejs24.x
    Architectures:
      - x86_64
    Tracing: Active
    Environment:
      Variables:
        NODE_OPTIONS: --enable-source-maps
        MONGODB_URI: !Ref MongoDbUri
        DB_NAME: !Ref DbName
        USER_POOL_ID: !Ref UserPoolId
        CLIENT_ID: !Ref ClientId
        UPLOADS_BUCKET: !Ref UploadsBucket
        EXPORTS_BUCKET: !Ref ExportsBucket
        STANDARD_SYMBOLS_BUCKET: !Ref StandardSymbolsBucket
        DOCUMENTATION_FILES_BUCKET: !Ref DocumentationFilesBucket
        CHARGEBEE_SITE: !Ref ChargebeeSite
        CHARGEBEE_API_KEY: !Ref ChargebeeApiKey
        CHARGEBEE_WEBHOOK_USERNAME: !Ref ChargebeeWebhookUsername
        CHARGEBEE_WEBHOOK_PASSWORD: !Ref ChargebeeWebhookPassword
        CHARGEBEE_SEAT_ADDON_ITEM_PRICE_ID: !Ref ChargebeeSeatAddonItemPriceId
        CHARGEBEE_SEAT_ADDON_ITEM_PRICE_ID_MONTHLY: !Ref ChargebeeSeatAddonItemPriceIdMonthly
        CHARGEBEE_SEAT_ADDON_ITEM_PRICE_ID_YEARLY: !Ref ChargebeeSeatAddonItemPriceIdYearly
        CHARGEBEE_APPROVER_SEAT_ADDON_ITEM_PRICE_ID_MONTHLY: !Ref ChargebeeApproverSeatAddonItemPriceIdMonthly
        CHARGEBEE_APPROVER_SEAT_ADDON_ITEM_PRICE_ID_YEARLY: !Ref ChargebeeApproverSeatAddonItemPriceIdYearly
        CHARGEBEE_SSO_ADDON_ITEM_PRICE_ID: !Ref ChargebeeSsoAddonItemPriceId
        CHARGEBEE_SSO_ADDON_ITEM_PRICE_ID_MONTHLY: !Ref ChargebeeSsoAddonItemPriceIdMonthly
        CHARGEBEE_SSO_ADDON_ITEM_PRICE_ID_YEARLY: !Ref ChargebeeSsoAddonItemPriceIdYearly
        SES_FROM_ADDRESS: !Ref SesFromAddress
        APP_BASE_URL: !Ref AppBaseUrl
        MONITORING_STACK: !If [HasMonitoringAlerts, !Ref AWS::StackName, ""]
        POSTHOG_PROJECT_TOKEN: !Ref PosthogProjectToken
        POSTHOG_HOST: https://us.i.posthog.com
    # You can add LoggingConfig parameters such as the Logformat, Log Group, and SystemLogLevel or ApplicationLogLevel. Learn more here https://docs.aws.amazon.com/serverless-application-model/latest/developerguide/sam-resource-function.html#sam-function-loggingconfig.
    LoggingConfig:
      LogFormat: JSON

  Api:
    TracingEnabled: true
    MinimumCompressionSize: 1024

Conditions:
  HasExportJobQueueUrl: !Not [!Equals [!Ref ExportJobQueueUrl, ""]]
  UseDocumentationCloudFrontPrivateKey: !Not [!Equals [!Ref DocumentationCloudFrontPrivateKeyParam, ""]]
  HasSupportReviewerEmailsParam: !Not [!Equals [!Ref SupportReviewerEmailsParam, ""]]
  HasPosthogSupportSecretParam: !Not [!Equals [!Ref PosthogSupportSecretParam, ""]]
  HasSupportAttachmentsAllowedOrigins: !Not [!Equals [!Ref SupportAttachmentsAllowedOrigins, ""]]
  HasMonitoringAlerts: !Not [!Equals [!Ref MonitoringAlertEmail, ""]]

Resources:
  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/health/getHealth.lambdaHandler
      Timeout: 10
      MemorySize: 256
      Events:
        GetHealth:
          Type: Api
          Properties:
            Path: /health
            Method: get
    Metadata:
      BuildMethod: makefile

  # ──────────────────────────────────────────────────────────────────────────
  # USERS
  # ──────────────────────────────────────────────────────────────────────────
  CreateUserFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/users/createUser.lambdaHandler
      Events:
        CreateUser:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /users
            Method: post
    Metadata:
      BuildMethod: makefile

  GetUserFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/users/getUser.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetUser:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /users/{id}
            Method: get
    Metadata:
      BuildMethod: makefile

  UpdateUserFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/users/updateUser.lambdaHandler
      Events:
        UpdateUser:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /users
            Method: put
    Metadata:
      BuildMethod: makefile

  DeleteUserFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/users/deleteUser.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminDisableUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
              Resource: !Sub "arn:aws:ses:${AWS::Region}:${AWS::AccountId}:identity/*"
      Events:
        DeleteUser:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /users/{id}
            Method: delete
    Metadata:
      BuildMethod: makefile

  UpdateUserAccessFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/users/updateUserAccess.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
      Events:
        UpdateUserAccess:
          Type: Api
          Properties:
            Path: /users/{id}/access
            Method: patch
    Metadata:
      BuildMethod: makefile

  GetAllUsersByWorkspaceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/users/getAllUsersByWorkspace.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetAllUsersByWorkspace:
          Type: Api
          Properties:
            Path: /users/workspace
            Method: get
    Metadata:
      BuildMethod: makefile

  # ──────────────────────────────────────────────────────────────────────────
  # ONBOARDING
  # ──────────────────────────────────────────────────────────────────────────
  AdminOnboardingCreateWorkspaceFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/onboarding/adminOnboardingCreateWorkspace.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminAddUserToGroup
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        AdminOnboardingCreateWorkspace:
          Type: Api
          Properties:
            Path: /onboarding/admin/workspace
            Method: post
    Metadata:
      BuildMethod: makefile

  InviteNewUserByAdminFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/onboarding/InviteNewUserByAdmin.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
      Events:
        InviteNewUserByAdmin:
          Type: Api
          Properties:
            Path: /invites/workspace/{workspaceId}
            Method: post
    Metadata:
      BuildMethod: makefile

  OnboardAndUpdateInvitedUserFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/onboarding/onboardAndUpdateInvitedUser.handler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminAddUserToGroup
                - cognito-idp:AdminRemoveUserFromGroup
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
      Events:
        OnboardAndUpdateInvitedUser:
          Type: Api
          Properties:
            Path: /onboarding/user
            Method: put
    Metadata:
      BuildMethod: makefile

  # ──────────────────────────────────────────────────────────────────────────
  # WORKSPACES
  # ──────────────────────────────────────────────────────────────────────────
  GetWorkspaceFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/workspaces/getWorkspace.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetWorkspace:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /workspace/{id}
            Method: get
    Metadata:
      BuildMethod: makefile

  UpdateWorkspaceFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/workspaces/updateWorkspace.lambdaHandler
      Events:
        UpdateWorkspace:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /workspace
            Method: put
    Metadata:
      BuildMethod: makefile

  # ──────────────────────────────────────────────────────────────────────────
  # DEPARTMENTS
  # ──────────────────────────────────────────────────────────────────────────
  CreateDepartmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/departments/createDepartment.lambdaHandler
      Events:
        CreateDepartment:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /departments
            Method: post
    Metadata:
      BuildMethod: makefile

  GetDepartmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/departments/getDepartment.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetDepartment:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /departments/{id}
            Method: get
    Metadata:
      BuildMethod: makefile

  GetAllDepartmentsFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-0-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/departments/getAllDepartments.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetAllDepartments:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-0-31.md#api
          Properties:
            Path: /departments
            Method: get
    Metadata:
      BuildMethod: makefile

  UpdateDepartmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/departments/updateDepartment.lambdaHandler
      Events:
        UpdateDepartment:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /departments
            Method: put
    Metadata:
      BuildMethod: makefile

  ArchiveDepartmentFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/departments/archiveDepartment.lambdaHandler
      Events:
        ArchiveDepartment:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /departments/{id}
            Method: patch
    Metadata:
      BuildMethod: makefile

  # ──────────────────────────────────────────────────────────────────────────
  # PROJECTS
  # ──────────────────────────────────────────────────────────────────────────

  CreateProjectFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/projects/createProject.lambdaHandler
      Events:
        CreateProject:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /projects
            Method: post
    Metadata:
      BuildMethod: makefile

  UpdateProjectFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/projects/updateProject.lambdaHandler
      Events:
        UpdateProject:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /projects
            Method: put
    Metadata:
      BuildMethod: makefile

  GetAllProjectsFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/projects/getAllProjects.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetAllProjects:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /projects
            Method: get
    Metadata:
      BuildMethod: makefile

  GetProjectFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/projects/getProject.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetProject:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /projects/{id}
            Method: get
    Metadata:
      BuildMethod: makefile

  ArchiveProjectFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/projects/archiveProject.lambdaHandler
      Events:
        ArchiveProject:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /projects/{id}
            Method: patch
    Metadata:
      BuildMethod: makefile

  # ──────────────────────────────────────────────────────────────────────────
  # PRODUCTS
  # ──────────────────────────────────────────────────────────────────────────

  CreateProductFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/products/createProduct.lambdaHandler
      Events:
        CreateProduct:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /products
            Method: post
    Metadata:
      BuildMethod: makefile

  CheckProductImportFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/products/checkProductImport.lambdaHandler
      Events:
        CheckProductImport:
          Type: Api
          Properties:
            Path: /products/import/check
            Method: post
    Metadata:
      BuildMethod: makefile

  ImportProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/products/importProducts.lambdaHandler
      Events:
        ImportProducts:
          Type: Api
          Properties:
            Path: /products/import
            Method: post
    Metadata:
      BuildMethod: makefile

  GetAllProductsFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/products/getAllProducts.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
              Resource: !Sub "arn:aws:s3:::${UploadsBucket}/uploads/*"
      Events:
        GetAllProducts:
          Type: Api # More info about API Event Source: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#api
          Properties:
            Path: /products
            Method: get
    Metadata:
      BuildMethod: makefile

  UpdateProductFunction:
    Type: AWS::Serverless::Function # More info about Function Resource: https://github.com/awslabs/serverless-application-model/blob/master/versions/2016-10-31.md#awsserverlessfunction
    Properties:
      CodeUri: src/
      Handler: controllers/products/updateProduct.lambdaHandler
      Policies:
        - Statement:
            - Effect: Allow
