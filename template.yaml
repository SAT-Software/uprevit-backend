  # ──────────────────────────────────────────────────────────────────────────
  # SUPPORT
  # ──────────────────────────────────────────────────────────────────────────

  SupportAttachmentsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${AWS::StackName}-support-attachments-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration: !If
        - HasSupportAttachmentsAllowedOrigins
        - CorsRules:
            - AllowedOrigins: !Split [",", !Ref SupportAttachmentsAllowedOrigins]
              AllowedMethods:
                - POST
              MaxAge: 3000
        - !Ref AWS::NoValue

  SupportAttachmentsBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SupportAttachmentsBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource:
              - !GetAtt SupportAttachmentsBucket.Arn
              - !Sub "${SupportAttachmentsBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

  GetSupportConfigFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/support/getSupportConfig.lambdaHandler
      Environment:
        Variables:
          POSTHOG_SUPPORT_SECRET_PARAM: !Ref PosthogSupportSecretParam
      Policies:
        - !If
          - HasPosthogSupportSecretParam
          - Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${PosthogSupportSecretParam}"
          - !Ref AWS::NoValue
      Events:
        GetSupportConfig:
          Type: Api
          Properties:
            Path: /support/config
            Method: get
    Metadata:
      BuildMethod: makefile

  CreateSupportAttachmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/support/createSupportAttachment.lambdaHandler
      Environment:
        Variables:
          SUPPORT_ATTACHMENTS_BUCKET: !Ref SupportAttachmentsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:PutObject
              Resource: !Sub "${SupportAttachmentsBucket.Arn}/attachments/*"
      Events:
        CreateSupportAttachment:
          Type: Api
          Properties:
            Path: /support/attachments
            Method: post
    Metadata:
      BuildMethod: makefile

  CompleteSupportAttachmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/support/completeSupportAttachment.lambdaHandler
      Environment:
        Variables:
          SUPPORT_ATTACHMENTS_BUCKET: !Ref SupportAttachmentsBucket
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
              Resource: !Sub "${SupportAttachmentsBucket.Arn}/attachments/*"
      Events:
        CompleteSupportAttachment:
          Type: Api
          Properties:
            Path: /support/attachments/{id}/complete
            Method: post
    Metadata:
      BuildMethod: makefile

  GetSupportAttachmentFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
      Handler: controllers/support/getSupportAttachment.lambdaHandler
      Environment:
        Variables:
          SUPPORT_ATTACHMENTS_BUCKET: !Ref SupportAttachmentsBucket
          SUPPORT_REVIEWER_EMAILS_PARAM: !Ref SupportReviewerEmailsParam
      Policies:
        - Statement:
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectVersion
              Resource: !Sub "${SupportAttachmentsBucket.Arn}/attachments/*"
            - Effect: Allow
              Action:
                - cognito-idp:AdminGetUser
              Resource: !Sub "arn:aws:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/${UserPoolId}"
        - !If
          - HasSupportReviewerEmailsParam
          - Statement:
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter${SupportReviewerEmailsParam}"
          - !Ref AWS::NoValue
      Events:
        GetSupportAttachment:
          Type: Api
          Properties:
            Path: /support/attachments/{id}
            Method: get
    Metadata:
      BuildMethod: makefile

  # ──────────────────────────────────────────────────────────────────────────
  # S3 STORAGE
  # ──────────────────────────────────────────────────────────────────────────

  PresignUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: src/
